# 自动发布：推送 v* tag 即触发，构建 macOS + Windows 产物并创建 GitHub Release。
#
# 用法（详见 AGENTS.md「发布流程」）：
#   1. 改 package.json 的 version（如 0.4.5）
#   2. 提交后 git tag -a v0.4.5 -m "v0.4.5" && git push origin v0.4.5
#   3. workflow 自动验证 tag 与版本号一致 → 双平台构建 → 发布 Release
#
# 关键点：
#   - secrets.enc 密文已提交 git，云端无需配置任何 key 即可编译内置实例。
#   - macOS 用 universal-apple-darwin：单个 dmg 同时支持 Apple Silicon 与 Intel。
#   - Windows runner 默认 msvc 工具链，满足项目强制 msvc 的要求。
#   - 版本号单一真相源是 package.json；beforeBuildCommand 会自动跑
#     sync-version 同步到 tauri.conf.json / Cargo.toml。
#   - **产物统一重命名为 ASCII**（aistatus_<ver>_<平台>.<ext>）：Tauri 按
#     productName（中文「AI余额监控」）命名产物，而 GitHub Release 附件名
#     不支持非 ASCII 字符，会把中文替换成下划线（AI._0.4.4_universal.dmg）。
#     故构建后先收集改名，再由独立的 publish job 统一上传（同时避免矩阵
#     两个 job 并发创建 Release 的竞争）。
#   - 发布拆成 build → publish 两段：publish 只有在两个平台都构建成功后才
#     创建 Release，不会出现「一半产物」的半成品发布。

name: release

on:
  push:
    tags:
      - "v*"

# tauri-action 构建、softprops/action-gh-release 创建 Release 都需要写权限
permissions:
  contents: write

# 同一 tag 重复推送（强制更新 tag）时只保留最新一次运行
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 版本一致性校验：tag 必须与 package.json 的 version 完全一致，
  # 避免发出「v0.4.5 的包其实是 0.4.4」这种不可追溯的产物。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 version $pkg 不一致；请先改 package.json 版本再打 tag"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false # 一个平台失败不影响另一个平台的构建结果
      matrix:
        include:
          - platform: macos-latest
            # universal：一个 dmg 覆盖 Apple Silicon (aarch64) 与 Intel (x86_64)
            args: --target universal-apple-darwin
            artifact: macos
          - platform: windows-latest
            args: ""
            artifact: windows
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 构建需要两个 macOS target 同时存在
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 只构建不发布（不传 tagName/releaseName）：产物改名后交给 publish job
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      # 把 Tauri 按 productName 命名的中文产物收集并改名为 ASCII。
      # 各平台只会命中自己那几类文件（find 无匹配时循环体不执行）。
      # 用 find 而非 shopt globstar：macOS runner 的 /bin/bash 是 3.2，
      # globstar 是 bash 4.0+ 特性，shopt 会报「invalid shell option」并在
      # set -e 下直接失败（v0.4.5 首跑即因此失败）。
      - name: Collect bundles with ASCII names
        shell: bash
        run: |
          set -euo pipefail
          ver="$(node -p "require('./package.json').version")"
          mkdir -p dist-artifacts

          while IFS= read -r f; do
            cp "$f" "dist-artifacts/aistatus_${ver}_macos_universal.dmg"
          done < <(find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg')

          while IFS= read -r f; do
            cp "$f" "dist-artifacts/aistatus_${ver}_macos_universal.app.tar.gz"
          done < <(find src-tauri/target -type f -path '*/release/bundle/macos/*.app.tar.gz')

          while IFS= read -r f; do
            cp "$f" "dist-artifacts/aistatus_${ver}_windows_x64-setup.exe"
          done < <(find src-tauri/target -type f -path '*/release/bundle/nsis/*-setup.exe')

          while IFS= read -r f; do
            cp "$f" "dist-artifacts/aistatus_${ver}_windows_x64.msi"
          done < <(find src-tauri/target -type f -path '*/release/bundle/msi/*.msi')

          ls -l dist-artifacts
          # 防止命名规则与 Tauri 产物目录变化后静默上传空集合
          if [ -z "$(ls -A dist-artifacts)" ]; then
            echo "::error::没有收集到任何构建产物，请检查 Tauri 产物目录结构是否变化"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.artifact }}
          path: dist-artifacts/*
          if-no-files-found: error

  # 两个平台都构建成功后统一创建 Release 并上传，避免并发创建竞争
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -l dist-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            由 tag `${{ github.ref_name }}` 自动构建发布。

            **macOS**（universal，Apple Silicon + Intel 通用）
            - `aistatus_*_macos_universal.dmg`

            **Windows**
            - `aistatus_*_windows_x64-setup.exe`（NSIS 安装包）
            - `aistatus_*_windows_x64.msi`

            产物未签名：macOS 首次打开需右键「打开」（或 `xattr -cr`），Windows 会触发 SmartScreen 警告。
            完整变更见本仓库提交历史。
          files: dist-artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
