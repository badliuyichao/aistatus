# 自动发布：推送 v* tag 即触发，构建 macOS + Windows 产物并创建 GitHub Release。
#
# 用法（详见 AGENTS.md「发布流程」）：
#   1. 改 package.json 的 version（如 0.4.5）
#   2. 提交后 git tag -a v0.4.5 -m "v0.4.5" && git push origin v0.4.5
#   3. workflow 自动验证 tag 与版本号一致 → 双平台构建 → 发布 Release
#
# 关键点：
#   - secrets.enc 密文已提交 git，云端无需配置任何 key 即可编译内置实例。
#   - macOS 用 universal-apple-darwin：单个 dmg 同时支持 Apple Silicon 与 Intel。
#   - Windows runner 默认 msvc 工具链，满足项目强制 msvc 的要求。
#   - 版本号单一真相源是 package.json；beforeBuildCommand 会自动跑
#     sync-version 同步到 tauri.conf.json / Cargo.toml。

name: release

on:
  push:
    tags:
      - "v*"

# tauri-action 需要创建 Release 并上传附件
permissions:
  contents: write

# 同一 tag 重复推送（强制更新 tag）时只保留最新一次运行
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # 版本一致性校验：tag 必须与 package.json 的 version 完全一致，
  # 避免发出「v0.4.5 的包其实是 0.4.4」这种不可追溯的产物。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 version $pkg 不一致；请先改 package.json 版本再打 tag"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false # 一个平台失败不影响另一个平台上传产物
      matrix:
        include:
          - platform: macos-latest
            # universal：一个 dmg 覆盖 Apple Silicon (aarch64) 与 Intel (x86_64)
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal 构建需要两个 macOS target 同时存在
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            由 tag `${{ github.ref_name }}` 自动构建发布。

            - macOS：`*_universal.dmg`（Apple Silicon + Intel 通用，未签名，首次打开需右键「打开」）
            - Windows：`*_x64-setup.exe`（NSIS 安装包）、`*_x64_zh-CN.msi`

            完整变更见本仓库提交历史。
          releaseDraft: false
          prerelease: false
