[package]
name = "aistatus"
version = "0.4.3"
description = "AI API 余额监控悬浮框（Tauri 跨平台重写）"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aistatus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时 + 并发 HTTP 拉取三家 API
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
futures = "0.3"

# 跨平台用户数据目录（config.json）
dirs = "5"

# 用系统默认程序打开文件（ShellExecute / open / xdg-open）。
# 不用 tauri-plugin-opener：其 build script 内嵌权限模式数据，体积大且被本机杀软
# ML 启发式（TR/W64.Evo）确定性误报隔离；该 crate 是 opener 插件的底层实现，行为一致。
open = "5"

# 平台原生毛玻璃（Win acrylic/mica + mac vibrancy），失败降级 CSS
window-vibrancy = "0.5"

# Win11 系统原生圆角（DWMWA_WINDOW_CORNER_PREFERENCE）；仅 Windows 编译时拉入，
# 版本与 window-vibrancy 0.5.3 的依赖对齐（复用已编译产物，不引入新版本）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }
raw-window-handle = "0.6"

[profile.dev]
incremental = true

[profile.release]
# 不开 lto / codegen-units=1：编译慢且体积收益小。
# 常驻悬浮框用 opt-level=3 + 默认 codegen-units 已足够。
opt-level = 3

# build script / proc-macro 不带调试信息编译：减小 build-script-build.exe 体积。
# 本机杀软用 ML 启发式（TR/W64.Evo）盯「新编译、无签名」的本地构建产物，
# 越小越不显眼；dev profile 默认带调试信息，此处收益最大。
[profile.dev.build-override]
debug = false

[profile.release.build-override]
debug = false
